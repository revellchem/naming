<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dodgeball</title>
<!--
  DODGEBALL - a Punch-Out!! style reaction game.

  Controls:  Arrow keys (or A / D / S)  =  step left / step right / duck
             Enter or Space             =  start / restart
             P or Esc                   =  pause
             M                          =  mute       H = toggle hint arrows

  Rules:     A ball aimed at your LEFT side  -> step RIGHT   (press ->)
             A ball aimed at your RIGHT side -> step LEFT    (press <-)
             A HIGH ball (center, head)      -> DUCK, or step either way
             Every ball is labeled with a monatomic ion (see IONS below).
             One point per ball dodged. Three hits and you're out.
             High score is stored locally in this browser (localStorage).

  Integration hooks for the chemistry quiz (see bottom of script):
             window.Dodgeball.start() / .pause() / .resume() / .addLife() / .getScore()
             window.addEventListener('dodgeball:gameover', e => e.detail.score)
             The page also posts {type:'dodgeball:gameover', score} to window.parent
             when embedded in an iframe.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#0b0b14; overflow:hidden;
               font-family:'Press Start 2P', monospace; color:#fff; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; box-shadow:0 0 50px #000; touch-action:none; }
  #pad { position:fixed; left:0; right:0; bottom:10px; display:none; justify-content:center;
         gap:12px; pointer-events:none; }
  @media (pointer:coarse) { #pad { display:flex; } }
  #pad button { pointer-events:auto; width:68px; height:68px; font-size:30px; border-radius:14px;
                border:2px solid #39ff14; background:rgba(0,0,0,.55); color:#39ff14;
                user-select:none; -webkit-user-select:none; touch-action:none; }
  #pad button:active { background:rgba(57,255,20,.35); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="800" height="600"></canvas></div>
<div id="pad">
  <button data-d="left">&#9664;</button>
  <button data-d="duck">&#9660;</button>
  <button data-d="right">&#9654;</button>
</div>

<script>
'use strict';

/* ------------------------------------------------------------------ */
/*  Setup                                                              */
/* ------------------------------------------------------------------ */
const W = 800, H = 600;
const OPPONENT_NAME = 'THE PROFESSOR';
const HIGH_KEY = 'dodgeball.highscore';

const cv  = document.getElementById('game');
const ctx = cv.getContext('2d');
const isTouch = matchMedia('(pointer:coarse)').matches;
const view = { s:1, dpr:1 };

function resize() {
  const pad = isTouch ? 100 : 0;
  const s = Math.min(innerWidth / W, (innerHeight - pad) / H);
  view.s = s; view.dpr = devicePixelRatio || 1;
  cv.width  = Math.round(W * s * view.dpr);
  cv.height = Math.round(H * s * view.dpr);
  cv.style.width  = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', resize);
resize();

const FONT = '"Press Start 2P", monospace';
function font(px) { return px + 'px ' + FONT; }
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const pad6 = n => String(n).padStart(6, '0');
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}

/* ------------------------------------------------------------------ */
/*  Game constants                                                     */
/* ------------------------------------------------------------------ */
// Where each kind of throw lands (relative to the player standing still)
// and which dodges get you out of the way.
const TARGETS = {
  left : { x:295, y:430, ok:['right'],               key:'▶', label:'STEP RIGHT' },
  right: { x:505, y:430, ok:['left'],                key:'◀', label:'STEP LEFT'  },
  high : { x:400, y:335, ok:['duck', 'left', 'right'], key:'▼', label:'DUCK'     },
};
const TARGET_KEYS = Object.keys(TARGETS);

// Monatomic ions students need to know. Each ball carries one.
const IONS = [
  'Li+', 'Na+', 'K+', 'Rb+', 'Be2+', 'Mg2+', 'Ca2+', 'Sr2+',
  'Fe2+', 'Fe3+', 'Co2+', 'Co3+', 'Cu+', 'Cu2+', 'Zn2+', 'Al3+',
  'Sn2+', 'Sn4+', 'Pb2+', 'Pb4+',
  'N3−', 'O2−', 'F−', 'P3−', 'S2−', 'Cl−', 'Br−', 'I−',
];
const randomIon = () => IONS[Math.floor(Math.random() * IONS.length)];
const BALL_R_START = 14, BALL_R_END = 62;

const START_INTERVAL = 1.00;   // seconds between throws at the start
const MIN_INTERVAL   = 0.36;   // fastest the professor gets
const RAMP           = 0.98;   // interval multiplier per throw
const MIN_DODGE_TIME = 0.30;   // a tap keeps you dodging at least this long
const HINT_THROWS    = 6;      // show key hints for this many throws each game
const LIVES          = 3;

function flightTime(interval) {
  // slower throws early, faster later; roughly tracks the throw interval
  return 0.5 + 0.55 * (interval - MIN_INTERVAL) / (START_INTERVAL - MIN_INTERVAL);
}

/* ------------------------------------------------------------------ */
/*  State                                                              */
/* ------------------------------------------------------------------ */
let anim = 0;                       // always-running clock (animations, menus)
function loadHigh() { try { return +(localStorage.getItem(HIGH_KEY) || 0) || 0; } catch (e) { return 0; } }
const G = {
  mode:'title', t:0,
  score:0, high:loadHigh(), lives:LIVES,
  balls:[], nextThrow:0, interval:START_INTERVAL, throws:0, streak:0,
  dodge:null, dodgeStart:0,
  windup:null, follow:-9,           // follow = game time of last release
  hitFlash:0, flinch:0, shake:0,
  mood:'smile', moodUntil:0,
  pops:[], hitsTaken:0, newHigh:false, overAt:0,
  muted:false, showHints:true,
};
const held = {};

function setMood(m, dur) { G.mood = m; G.moodUntil = dur ? G.t + dur : Infinity; }

function startGame() {
  Object.assign(G, {
    mode:'play', t:0, score:0, lives:LIVES, balls:[], nextThrow:1.6,
    interval:START_INTERVAL, throws:0, streak:0, dodge:null, dodgeStart:0,
    windup:null, follow:-9, hitFlash:0, flinch:0, shake:0,
    mood:'smile', moodUntil:Infinity, pops:[], hitsTaken:0, newHigh:false,
  });
  sfx('start');
}

function gameOver() {
  G.mode = 'over'; G.overAt = anim;
  if (G.score > G.high) {
    G.high = G.score; G.newHigh = true;
    try { localStorage.setItem(HIGH_KEY, String(G.high)); } catch (e) {}
  }
  setMood('grin');
  sfx('over');
  const detail = { score:G.score, thrown:G.throws, hits:G.hitsTaken, high:G.high };
  dispatchEvent(new CustomEvent('dodgeball:gameover', { detail }));
  if (window.parent !== window) {
    try { window.parent.postMessage({ type:'dodgeball:gameover', ...detail }, '*'); } catch (e) {}
  }
}

function togglePause() {
  if (G.mode === 'play') G.mode = 'pause';
  else if (G.mode === 'pause') G.mode = 'play';
}

function pop(text, x, y, color) { G.pops.push({ text, x, y, color, t0:anim }); }

/* ------------------------------------------------------------------ */
/*  Input                                                              */
/* ------------------------------------------------------------------ */
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowDown:'duck', KeyS:'duck',
};
function press(d) {
  held[d] = true;
  if (G.mode === 'play') { G.dodge = d; G.dodgeStart = G.t; }
}
function release(d) { held[d] = false; }
function action() {
  audio();
  if (G.mode === 'title') startGame();
  else if (G.mode === 'over' && anim - G.overAt > 0.8) startGame();
  else if (G.mode === 'pause') togglePause();
}
addEventListener('keydown', e => {
  const d = KEYMAP[e.code];
  if (d) { e.preventDefault(); if (!e.repeat) press(d); return; }
  if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); action(); }
  else if (e.code === 'KeyM') G.muted = !G.muted;
  else if (e.code === 'KeyH') G.showHints = !G.showHints;
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});
addEventListener('keyup', e => { const d = KEYMAP[e.code]; if (d) release(d); });
addEventListener('blur', () => { for (const k in held) held[k] = false; if (G.mode === 'play') togglePause(); });
cv.addEventListener('pointerdown', () => { if (G.mode !== 'play') action(); });
document.querySelectorAll('#pad button').forEach(b => {
  const d = b.dataset.d;
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); press(d); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => release(d));
});

/* ------------------------------------------------------------------ */
/*  Sound (tiny WebAudio synth, no files needed)                       */
/* ------------------------------------------------------------------ */
let AC = null, noiseBuf = null;
function audio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  return AC;
}
function tone(type, f0, f1, dur, vol, t) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}
function noise(f0, f1, dur, vol, t, q) {
  const s = AC.createBufferSource(), g = AC.createGain(), bp = AC.createBiquadFilter();
  s.buffer = noiseBuf; bp.type = 'bandpass'; bp.Q.value = q || 1;
  bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(bp).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
function sfx(kind) {
  if (G.muted || !AC) return;
  try {
    const t = AC.currentTime;
    if (kind === 'throw')  noise(600, 200, 0.12, 0.25, t, 0.8);
    if (kind === 'whoosh') noise(300, 3000, 0.28, 0.35, t, 2);
    if (kind === 'hit')    { tone('sine', 160, 40, 0.3, 0.7, t); noise(1500, 200, 0.15, 0.5, t, 0.7); }
    if (kind === 'start')  { tone('square', 440, 440, 0.08, 0.2, t); tone('square', 660, 660, 0.08, 0.2, t + 0.1); tone('square', 880, 880, 0.15, 0.2, t + 0.2); }
    if (kind === 'over')   { tone('square', 392, 392, 0.2, 0.2, t); tone('square', 330, 330, 0.2, 0.2, t + 0.22); tone('square', 262, 200, 0.5, 0.2, t + 0.44); }
    if (kind === 'streak') { tone('triangle', 660, 990, 0.12, 0.25, t); tone('triangle', 990, 1320, 0.15, 0.25, t + 0.1); }
  } catch (e) {}
}

/* ------------------------------------------------------------------ */
/*  Update                                                             */
/* ------------------------------------------------------------------ */
function throwBall(target, ion) {
  const lean = target === 'left' ? -7 : target === 'right' ? 7 : 0;
  const hand = armPose(1, 0, target, 400 + lean).hd;
  G.balls.push({ target, ion, t0:G.t, flight:flightTime(G.interval), p:0,
                 from:{ x:hand[0], y:hand[1] - 12 } });
  G.follow = G.t;
  sfx('throw');
}

function update(dt) {
  G.t += dt;

  // Dodge expires when the key is up and the minimum time has passed.
  if (G.dodge && !held[G.dodge] && G.t - G.dodgeStart > MIN_DODGE_TIME) {
    G.dodge = null;
    for (const k in held) if (held[k]) { G.dodge = k; break; }
  }

  // Wind-up telegraphs the next throw, then release.
  const windDur = Math.min(0.45, G.interval * 0.55);
  if (!G.windup && G.t >= G.nextThrow - windDur) {
    G.windup = { target:TARGET_KEYS[Math.floor(Math.random() * TARGET_KEYS.length)],
                 ion:randomIon(), start:G.t, end:G.nextThrow };
  }
  if (G.windup && G.t >= G.nextThrow) {
    throwBall(G.windup.target, G.windup.ion);
    G.windup = null;
    G.throws++;
    G.interval = Math.max(MIN_INTERVAL, G.interval * RAMP);
    G.nextThrow = G.t + G.interval;
  }

  // Balls in flight.
  for (const b of G.balls) {
    b.p = (G.t - b.t0) / b.flight;
    if (!b.resolved && b.p >= 1) {
      b.resolved = true;
      const T = TARGETS[b.target];
      if (T.ok.includes(G.dodge)) {
        b.dodged = true; G.score++; G.streak++;
        sfx('whoosh');
        if (G.streak % 10 === 0) { pop(G.streak + ' IN A ROW!', 400, 250, '#f2b81c'); sfx('streak'); }
        if (G.streak >= 8) setMood('grim');
      } else {
        b.hit = true; G.lives--; G.streak = 0; G.hitsTaken++;
        G.hitFlash = 0.25; G.flinch = 0.5; G.shake = 0.3;
        pop('OOF!', T.x, T.y - 40, '#ff4d4d');
        sfx('hit');
        setMood('grin', 1.6);
        if (G.lives <= 0) { gameOver(); return; }
      }
    }
  }
  G.balls = G.balls.filter(b => b.p < (b.hit ? 1.7 : 1.35));

  if (G.mood !== 'smile' && G.t > G.moodUntil) setMood(G.streak >= 8 ? 'grim' : 'smile');
  decay(dt);
}

function decay(dt) {
  G.hitFlash = Math.max(0, G.hitFlash - dt);
  G.flinch   = Math.max(0, G.flinch - dt);
  G.shake    = Math.max(0, G.shake - dt);
}

// After game over: let balls already in the air finish their flight.
function coast(dt) {
  G.t += dt;
  for (const b of G.balls) {
    b.p = (G.t - b.t0) / b.flight;
    if (!b.resolved && b.p >= 1) { b.resolved = true; b.dodged = true; }
  }
  G.balls = G.balls.filter(b => b.p < (b.hit ? 1.7 : 1.35));
  decay(dt);
}

/* ------------------------------------------------------------------ */
/*  Backdrop (drawn once to an offscreen canvas)                       */
/* ------------------------------------------------------------------ */
const logo = new Image();
logo.onload = () => drawBackdrop();
logo.src = encodeURI('NC logo.png');

const bg = document.createElement('canvas');
bg.width = W * 2; bg.height = H * 2;

function drawBackdrop() {
  const c = bg.getContext('2d');
  c.setTransform(2, 0, 0, 2, 0, 0);

  // Upper wall: painted cinder block
  c.fillStyle = '#ece6d3'; c.fillRect(0, 0, W, 400);
  c.strokeStyle = 'rgba(0,0,0,0.07)'; c.lineWidth = 1;
  for (let y = 60, row = 0; y < 300; y += 24, row++) {
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
    for (let x = (row % 2) * 30; x < W; x += 60) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 24); c.stroke(); }
  }
  // Ceiling lights
  for (const x of [120, 400, 680]) {
    const g = c.createRadialGradient(x, 52, 4, x, 52, 120);
    g.addColorStop(0, 'rgba(255,250,220,0.55)'); g.addColorStop(1, 'rgba(255,250,220,0)');
    c.fillStyle = g; c.fillRect(x - 130, 40, 260, 140);
    c.fillStyle = '#fffbe6'; rr(c, x - 40, 48, 80, 8, 3); c.fill();
    c.fillStyle = '#8a8a8a'; c.fillRect(x - 42, 46, 84, 3);
  }
  // Exit sign
  c.fillStyle = '#b3161b'; rr(c, 18, 60, 46, 16, 2); c.fill();
  c.fillStyle = '#fff'; c.font = font(7); c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('EXIT', 41, 69);

  // Lower wall: navy pads with a gold stripe
  c.fillStyle = '#27457f'; c.fillRect(0, 300, W, 100);
  c.fillStyle = '#f2b81c'; c.fillRect(0, 300, W, 6);
  c.strokeStyle = 'rgba(0,0,0,0.3)'; c.lineWidth = 2;
  for (let x = 40; x < W; x += 80) { c.beginPath(); c.moveTo(x, 306); c.lineTo(x, 400); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,0.08)'; c.fillRect(0, 306, W, 30);

  // Basketball hoop, mounted high on the back wall
  c.fillStyle = '#6a6a6a'; c.fillRect(392, 66, 16, 26);
  c.fillStyle = '#f5f5f5'; c.fillRect(352, 90, 96, 62);
  c.strokeStyle = '#9a9a9a'; c.lineWidth = 3; c.strokeRect(352, 90, 96, 62);
  c.strokeStyle = '#e8541c'; c.lineWidth = 2.5; c.strokeRect(385, 118, 30, 24);
  c.strokeStyle = '#e8541c'; c.lineWidth = 3;
  c.beginPath(); c.ellipse(400, 152, 17, 5, 0, 0, Math.PI * 2); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 1;
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2, x0 = 400 + Math.cos(a) * 17, x1 = 400 + Math.cos(a + 0.9) * 9;
    c.beginPath(); c.moveTo(x0, 152 + Math.sin(a) * 5); c.lineTo(x1, 180); c.stroke();
    c.beginPath(); c.moveTo(x0, 152 + Math.sin(a) * 5); c.lineTo(400 + Math.cos(a - 0.9) * 9, 180); c.stroke();
  }
  c.beginPath(); c.ellipse(400, 168, 13, 3.5, 0, 0, Math.PI * 2); c.stroke();
  c.beginPath(); c.ellipse(400, 180, 9, 2.5, 0, 0, Math.PI * 2); c.stroke();

  // Wall scoreboard (digits are drawn live)
  c.fillStyle = '#15151d'; rr(c, 92, 104, 156, 84, 6); c.fill();
  c.strokeStyle = '#8c8c94'; c.lineWidth = 3; rr(c, 92, 104, 156, 84, 6); c.stroke();
  c.fillStyle = '#f2b81c'; c.font = font(8); c.textAlign = 'center';
  c.fillText('HOME', 130, 120); c.fillText('GUEST', 210, 120);
  c.fillStyle = '#ddd'; c.font = font(6); c.fillText('DODGES', 130, 176); c.fillText('HITS', 210, 176);

  // School banner with the logo
  c.strokeStyle = '#3a3a3a'; c.lineWidth = 4;
  c.beginPath(); c.moveTo(552, 108); c.lineTo(708, 108); c.stroke();
  c.fillStyle = '#f7f3e6';
  c.beginPath(); c.moveTo(560, 110); c.lineTo(700, 110); c.lineTo(700, 262); c.lineTo(630, 280); c.lineTo(560, 262); c.closePath(); c.fill();
  c.strokeStyle = '#1d2f5e'; c.lineWidth = 5; c.stroke();
  c.strokeStyle = '#f2b81c'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(566, 116); c.lineTo(694, 116); c.lineTo(694, 259); c.lineTo(630, 275); c.lineTo(566, 259); c.closePath(); c.stroke();
  if (logo.complete && logo.naturalWidth) {
    c.drawImage(logo, 566, 120, 128, 128);
  } else {
    c.fillStyle = '#1d2f5e'; c.font = font(14); c.fillText('NCCA', 630, 190);
  }

  // Floor: hardwood in perspective
  const VP = { x:400, y:240 };
  const fg = c.createLinearGradient(0, 400, 0, 600);
  fg.addColorStop(0, '#b3844c'); fg.addColorStop(1, '#d7a466');
  c.fillStyle = fg; c.fillRect(0, 400, W, 200);
  c.save(); c.beginPath(); c.rect(0, 400, W, 200); c.clip();
  c.strokeStyle = 'rgba(80,40,10,0.28)'; c.lineWidth = 1.2;
  for (let x = -600; x <= 1400; x += 46) {
    c.beginPath(); c.moveTo(x, 600); c.lineTo(VP.x, VP.y); c.stroke();
  }
  for (let k = 1; k <= 9; k++) {
    const y = 400 + 200 * Math.pow(k / 9, 2);
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
  }
  // Court markings
  c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(0, 403); c.lineTo(W, 403); c.stroke();
  c.beginPath(); c.moveTo(270, 600); c.lineTo(342, 403); c.lineTo(458, 403); c.lineTo(530, 600); c.stroke();
  c.beginPath(); c.moveTo(317, 470); c.lineTo(483, 470); c.stroke();
  c.beginPath(); c.ellipse(400, 470, 83, 28, 0, 0, Math.PI * 2); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,0.65)';
  c.beginPath(); c.ellipse(400, 403, 340, 150, 0, 0, Math.PI); c.stroke();
  c.strokeStyle = '#f2b81c'; c.lineWidth = 2;
  c.beginPath(); c.ellipse(400, 403, 348, 155, 0, 0, Math.PI); c.stroke();
  // Gloss from the lights
  const gl = c.createRadialGradient(400, 600, 20, 400, 600, 520);
  gl.addColorStop(0, 'rgba(255,255,255,0.18)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = gl; c.fillRect(0, 400, W, 200);
  c.restore();
}
drawBackdrop();

/* ------------------------------------------------------------------ */
/*  The Professor                                                      */
/* ------------------------------------------------------------------ */
// Right arm (screen-left, since he faces us). w = wind-up 0..1, f = follow-through 0..1
function armPose(w, f, target, cx) {
  const rest = { el:[cx - 47, 300], hd:[cx - 45, 337], hr:8 };
  const wind = { el:[cx - 66, 248], hd:[cx - 54, 204 + (target === 'high' ? -12 : 0)], hr:8 };
  const foll = { el:[cx - 30, 276], hd:[cx - 14, 296], hr:12 };
  const mix = (A, B, t) => ({ el:[lerp(A.el[0], B.el[0], t), lerp(A.el[1], B.el[1], t)],
                              hd:[lerp(A.hd[0], B.hd[0], t), lerp(A.hd[1], B.hd[1], t)],
                              hr:lerp(A.hr, B.hr, t) });
  if (f > 0) return f < 0.4 ? mix(wind, foll, easeOut(f / 0.4)) : mix(foll, rest, (f - 0.4) / 0.6);
  return mix(rest, wind, easeOut(w));
}

function drawOpponent(c, o) {
  const cx = 400 + o.lean, bob = Math.sin(anim * 2.4) * 1.5;

  c.save(); c.translate(0, bob);
  // legs (khaki) and shoes
  c.fillStyle = KHAKI;
  c.beginPath(); c.moveTo(cx - 36, 338); c.lineTo(cx - 3, 338); c.lineTo(cx - 6, 416); c.lineTo(cx - 33, 416); c.closePath(); c.fill();

  c.beginPath(); c.moveTo(cx - 19, 345); c.lineTo(cx - 19, 412); c.stroke();
  c.beginPath(); c.moveTo(cx + 19, 345); c.lineTo(cx + 19, 412); c.stroke();
  c.fillStyle = '#3a2718';
  c.beginPath(); c.ellipse(cx - 19, 420, 17, 6, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(cx + 19, 420, 17, 6, 0, 0, Math.PI * 2); c.fill();

  // left arm (screen-right), relaxed or out for balance
  const w = o.wind, lx = cx + 40, lhy = lerp(337, 300, w * 0.6), lhx = lerp(cx + 46, cx + 58, w);
  c.lineCap = 'round'; c.lineWidth = 15; c.strokeStyle = SHIRT;
  c.beginPath(); c.moveTo(lx, 264); c.lineTo(cx + 50, 300); c.lineTo(lhx, lhy); c.stroke();
  c.fillStyle = SKIN; c.beginPath(); c.arc(lhx, lhy + 4, 8, 0, Math.PI * 2); c.fill();

  // torso: blue button-down
  c.fillStyle = SHIRT;
  c.beginPath(); c.moveTo(cx - 41, 258); c.lineTo(cx + 41, 258); c.lineTo(cx + 36, 340); c.lineTo(cx - 36, 340); c.closePath(); c.fill();
  c.fillStyle = 'rgba(0,0,0,0.12)'; c.fillRect(cx + 12, 258, 24, 82);          // shading
  c.fillStyle = SKIN; c.beginPath(); c.moveTo(cx - 9, 256); c.lineTo(cx + 9, 256); c.lineTo(cx, 270); c.closePath(); c.fill();
  c.fillStyle = '#5c8de0';                                                        // collar
  c.beginPath(); c.moveTo(cx - 16, 254); c.lineTo(cx - 2, 254); c.lineTo(cx - 1, 274); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(cx + 16, 254); c.lineTo(cx + 2, 254); c.lineTo(cx + 1, 274); c.closePath(); c.fill();
  c.strokeStyle = SHIRT_D; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(cx, 272); c.lineTo(cx, 338); c.stroke();               // placket
  c.strokeRect(cx + 14, 284, 16, 16);                                            // pocket
  c.fillStyle = '#1c3a6b';
  for (const y of [282, 298, 314, 330]) { c.beginPath(); c.arc(cx, y, 2.2, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = '#5a3b1e'; c.fillRect(cx - 36, 335, 72, 7);                      // belt
  c.fillStyle = '#c9a441'; c.fillRect(cx - 5, 334, 10, 9);

  // neck + head
  c.fillStyle = '#e6bd9b'; c.fillRect(cx - 8, 240, 16, 18);
  c.fillStyle = SKIN;
  c.beginPath(); c.ellipse(cx, 222 + o.headDy, 23, 27, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(cx - 24, 224 + o.headDy, 4, 6, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(cx + 24, 224 + o.headDy, 4, 6, 0, 0, Math.PI * 2); c.fill();

  // grey flat-top
  const hy = o.headDy;
  c.fillStyle = '#9a9a9a';
  c.beginPath(); c.moveTo(cx - 25, 212 + hy); c.lineTo(cx - 26, 194 + hy); c.lineTo(cx + 26, 194 + hy); c.lineTo(cx + 25, 212 + hy);
  c.quadraticCurveTo(cx, 204 + hy, cx - 25, 212 + hy); c.closePath(); c.fill();
  c.fillStyle = '#bdbdbd'; c.fillRect(cx - 24, 194 + hy, 48, 4);
  c.fillStyle = '#8a8a8a'; c.fillRect(cx - 25, 210 + hy, 4, 9); c.fillRect(cx + 21, 210 + hy, 4, 9);

  // face
  const ey = 223 + hy;
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(cx - 9, ey, 4.5, 3, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(cx + 9, ey, 4.5, 3, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#5b7fa6';
  c.beginPath(); c.arc(cx - 9, ey, 2, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(cx + 9, ey, 2, 0, Math.PI * 2); c.fill();
  // glasses
  c.strokeStyle = '#2a2a2a'; c.lineWidth = 1.6;
  rr(c, cx - 18, ey - 6, 18, 12, 3); c.stroke();
  rr(c, cx, ey - 6, 18, 12, 3); c.stroke();
  c.beginPath(); c.moveTo(cx - 1, ey - 2); c.lineTo(cx + 1, ey - 2); c.stroke();
  c.beginPath(); c.moveTo(cx - 18, ey - 2); c.lineTo(cx - 23, ey - 1); c.stroke();
  c.beginPath(); c.moveTo(cx + 18, ey - 2); c.lineTo(cx + 23, ey - 1); c.stroke();
  // eyebrows
  c.strokeStyle = '#7d7d7d'; c.lineWidth = 2;
  const tilt = o.mood === 'grim' ? 2.5 : 0;
  c.beginPath(); c.moveTo(cx - 15, ey - 11 - tilt * 0); c.lineTo(cx - 4, ey - 11 + tilt); c.stroke();
  c.beginPath(); c.moveTo(cx + 4, ey - 11 + tilt); c.lineTo(cx + 15, ey - 11); c.stroke();
  // nose
  c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(cx, ey + 2); c.lineTo(cx - 3, ey + 9); c.lineTo(cx + 1, ey + 10); c.stroke();
  // mouth
  const my = ey + 15;
  if (o.mood === 'grin') {
    c.fillStyle = '#5a1e1e'; c.beginPath(); c.ellipse(cx, my + 1, 10, 6, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(cx, my - 2, 9, 3, 0, 0, Math.PI); c.fill();
  } else if (o.mood === 'grim') {
    c.strokeStyle = '#8a4a3a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(cx - 8, my + 1); c.quadraticCurveTo(cx, my - 2, cx + 8, my + 1); c.stroke();
    // sweat drop

    c.beginPath(); c.moveTo(cx + 28, sy - 6); c.quadraticCurveTo(cx + 33, sy + 2, cx + 28, sy + 4);
    c.quadraticCurveTo(cx + 23, sy + 2, cx + 28, sy - 6); c.fill();
  } else {
    c.strokeStyle = '#8a4a3a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(cx - 9, my - 1); c.quadraticCurveTo(cx, my + 5, cx + 9, my - 1); c.stroke();
  }

  // right arm (screen-left) - the throwing arm, drawn in front
  const ap = armPose(o.wind, o.follow, o.target, cx);
  c.lineCap = 'round'; c.lineWidth = 15; c.strokeStyle = SHIRT;
  c.beginPath(); c.moveTo(cx - 40, 264); c.lineTo(ap.el[0], ap.el[1]); c.lineTo(ap.hd[0], ap.hd[1]); c.stroke();
  c.fillStyle = SKIN; c.beginPath(); c.arc(ap.hd[0], ap.hd[1], ap.hr, 0, Math.PI * 2); c.fill();
  if (o.ballInHand) drawBall(c, ap.hd[0] + 2, ap.hd[1] - 12, BALL_R_START, 1, o.ion);
  if (o.tossBall) drawBall(c, ap.hd[0] + 2, ap.hd[1] - 15 - Math.abs(Math.sin(anim * 3)) * 45, BALL_R_START, 1,
                           IONS[Math.floor(anim * 3 / Math.PI) % IONS.length]);
  c.restore();
}

/* ------------------------------------------------------------------ */
/*  Ball                                                               */
/* ------------------------------------------------------------------ */
function drawBall(c, x, y, r, alpha, ion) {
  c.save(); c.globalAlpha = alpha;
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, '#ff8080'); g.addColorStop(0.55, '#d62828'); g.addColorStop(1, '#7d1010');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.28)'; c.lineWidth = Math.max(1, r * 0.06);
  c.beginPath(); c.ellipse(x, y, r * 0.5, r * 0.98, 0.3, 0, Math.PI * 2); c.stroke();
  if (ion && r >= 10) drawIonLabel(c, x, y, r, ion);
  c.restore();
}

// "Fe3+" -> symbol "Fe" with a raised "3+" charge, sized to the ball.
function drawIonLabel(c, x, y, r, ion) {
  const m = /^([A-Za-z]+)(.*)$/.exec(ion);
  const sym = m ? m[1] : ion, chg = m ? m[2] : '';
  const big = Math.round(r * 0.95), small = Math.round(r * 0.55);
  const symFont = 'bold ' + big + 'px Arial, Helvetica, sans-serif';
  const chgFont = 'bold ' + small + 'px Arial, Helvetica, sans-serif';
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.font = symFont; const wS = c.measureText(sym).width;
  c.font = chgFont; const wC = chg ? c.measureText(chg).width : 0;
  const x0 = x - (wS + wC) / 2, base = y + big * 0.36;
  c.lineJoin = 'round'; c.strokeStyle = 'rgba(40,0,0,0.85)'; c.fillStyle = '#fff';
  c.lineWidth = Math.max(2, r * 0.12);
  c.font = symFont; c.strokeText(sym, x0, base); c.fillText(sym, x0, base);
  if (chg) {
    c.font = chgFont; c.lineWidth = Math.max(1.5, r * 0.09);
    c.strokeText(chg, x0 + wS, base - big * 0.5); c.fillText(chg, x0 + wS, base - big * 0.5);
  }
}

function ballPos(b) {
  const S = b.from, E = TARGETS[b.target], p = b.p;
  if (p <= 1) {
    return { x:lerp(S.x, E.x, p), y:lerp(S.y, E.y, p) - Math.sin(p * Math.PI) * 45,
             r:BALL_R_START + (BALL_R_END - BALL_R_START) * p, a:1 };
  }
  const q = p - 1;
  if (b.dodged) {   // sails past the camera
    return { x:E.x + (E.x - S.x) * q * 2.2, y:E.y + (E.y - S.y) * q * 1.6 + q * q * 200,
             r:BALL_R_END + 260 * q, a:clamp(1 - q / 0.32, 0, 1) };
  }                 // bounces off you and drops
  return { x:E.x - (E.x - S.x) * q * 0.5, y:E.y - 170 * q + 420 * q * q,
           r:BALL_R_END - 20 * q, a:clamp(1 - q / 0.7, 0, 1) };
}

/* ------------------------------------------------------------------ */
/*  The player (green wireframe, seen from behind)                     */
/* ------------------------------------------------------------------ */
let dodgeAmt = 0, dodgeShown = null;
function drawPlayer(c, dt) {
  // ease the dodge animation
  if (G.dodge) { dodgeShown = G.dodge; dodgeAmt = Math.min(1, dodgeAmt + dt / 0.08); }
  else dodgeAmt = Math.max(0, dodgeAmt - dt / 0.10);
  const a = easeOut(dodgeAmt), d = dodgeShown;

  c.save();
  if (G.flinch > 0) c.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
  c.translate(400, 598);
  if (d === 'left')  { c.translate(-145 * a, 0); c.rotate(-0.16 * a); }
  if (d === 'right') { c.translate( 145 * a, 0); c.rotate( 0.16 * a); }
  if (d === 'duck')  { c.scale(1 + 0.12 * a, 1 - 0.45 * a); }
  c.translate(-400, -598);

  const col = G.flinch > 0 && Math.floor(anim * 20) % 2 ? '#ff5050' : '#39ff14';
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3.5; c.lineJoin = 'round'; c.lineCap = 'round';
  c.shadowColor = col; c.shadowBlur = 14; c.globalAlpha = 0.92;

  const path = [
    [[330, 382], [355, 480], [445, 480], [470, 382], [330, 382]],   // torso
    [[330, 382], [298, 440], [332, 416]],                           // left arm (ready)
    [[470, 382], [502, 440], [468, 416]],                           // right arm
    [[363, 480], [352, 545], [348, 598]],                           // left leg
    [[437, 480], [448, 545], [452, 598]],                           // right leg
    [[388, 366], [412, 366]],                                       // neck
  ];
  for (const seg of path) {
    c.beginPath(); c.moveTo(seg[0][0], seg[0][1]);
    for (let i = 1; i < seg.length; i++) c.lineTo(seg[i][0], seg[i][1]);
    c.stroke();
  }
  c.beginPath(); c.arc(400, 334, 32, 0, Math.PI * 2); c.stroke();                   // head
  c.beginPath(); c.arc(332, 416, 10, 0, Math.PI * 2); c.stroke();                   // hands
  c.beginPath(); c.arc(468, 416, 10, 0, Math.PI * 2); c.stroke();
  c.beginPath(); c.moveTo(370, 430); c.lineTo(430, 430); c.stroke();                // jersey stripe
  c.globalAlpha = 0.18; c.beginPath(); c.arc(400, 334, 32, 0, Math.PI * 2); c.fill();
  c.restore();
}

/* ------------------------------------------------------------------ */
/*  HUD & overlays                                                     */
/* ------------------------------------------------------------------ */
function drawHUD(c) {
  c.fillStyle = '#101020'; c.fillRect(0, 0, W, 46);
  c.fillStyle = '#f2b81c'; c.fillRect(0, 46, W, 3);
  c.font = font(11); c.textBaseline = 'middle';
  c.textAlign = 'left'; c.fillStyle = '#fff'; c.fillText('SCORE', 18, 16);
  c.fillStyle = '#39ff14'; c.fillText(pad6(G.score), 18, 33);
  c.textAlign = 'center'; c.fillStyle = '#f2b81c'; c.fillText('HIGH SCORE', 400, 16);
  c.fillStyle = (G.mode === 'over' && G.newHigh && Math.floor(anim * 3) % 2) ? '#f2b81c' : '#fff';
  c.fillText(pad6(G.high), 400, 33);
  c.textAlign = 'right'; c.fillStyle = '#fff'; c.fillText('HITS LEFT', 782, 16);
  for (let i = 0; i < LIVES; i++) {
    const x = 782 - (LIVES - 1 - i) * 22 - 8;
    if (i < G.lives) drawBall(c, x, 33, 8, 1);
    else { c.strokeStyle = '#555'; c.lineWidth = 2; c.beginPath(); c.arc(x, 33, 8, 0, Math.PI * 2); c.stroke(); }
  }
  if (G.streak >= 3 && G.mode === 'play') {
    c.textAlign = 'right'; c.fillStyle = '#f2b81c'; c.font = font(9);
    c.fillText('STREAK ' + G.streak, 782, 62);
  }
  // Wall scoreboard digits
  c.font = font(18); c.textAlign = 'center'; c.fillStyle = '#ff3b3b';
  c.shadowColor = '#ff3b3b'; c.shadowBlur = 8;
  c.fillText(String(Math.min(99, G.score)).padStart(2, '0'), 130, 148);
  c.fillText(String(Math.min(99, G.hitsTaken)).padStart(2, '0'), 210, 148);
  c.shadowBlur = 0;
}

function keycap(c, x, y, key, label) {
  c.save(); c.globalAlpha = 0.95;
  c.fillStyle = '#101020'; c.strokeStyle = '#39ff14'; c.lineWidth = 2;
  rr(c, x - 17, y - 17, 34, 34, 6); c.fill(); c.stroke();
  c.fillStyle = '#39ff14'; c.font = font(16); c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(key, x, y + 1);
  c.font = font(8); c.fillStyle = '#fff'; c.fillText(label, x, y + 30);
  c.restore();
}

function drawPops(c) {
  G.pops = G.pops.filter(p => anim - p.t0 < 0.9);
  for (const p of G.pops) {
    const q = (anim - p.t0) / 0.9;
    c.save(); c.globalAlpha = 1 - q; c.fillStyle = p.color; c.font = font(14); c.textAlign = 'center';
    c.shadowColor = '#000'; c.shadowBlur = 6;
    c.fillText(p.text, p.x, p.y - q * 40); c.restore();
  }
}

function drawTitle(c) {
  c.fillStyle = 'rgba(5,5,20,0.55)'; c.fillRect(0, 49, W, H - 49);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = font(46); c.fillStyle = '#1d2f5e'; c.fillText('DODGEBALL', 404, 134);
  c.fillStyle = '#f2b81c'; c.fillText('DODGEBALL', 400, 130);
  c.font = font(12); c.fillStyle = '#fff'; c.fillText('vs. ' + OPPONENT_NAME, 400, 172);

  c.font = font(9); c.textAlign = 'left';
  const rows = [
    ['▶', 'BALL AT YOUR LEFT  ->  STEP RIGHT'],
    ['◀', 'BALL AT YOUR RIGHT ->  STEP LEFT'],
    ['▼', 'HIGH BALL (center) ->  DUCK, OR STEP ASIDE'],
  ];
  rows.forEach((r, i) => {
    const y = 250 + i * 36;
    c.fillStyle = '#101020'; c.strokeStyle = '#39ff14'; c.lineWidth = 2; rr(c, 196, y - 13, 26, 26, 5); c.fill(); c.stroke();
    c.fillStyle = '#39ff14'; c.font = font(12); c.textAlign = 'center'; c.fillText(r[0], 209, y + 1);
    c.fillStyle = '#fff'; c.font = font(9); c.textAlign = 'left'; c.fillText(r[1], 236, y);
  });
  c.textAlign = 'center'; c.fillStyle = '#bbb'; c.font = font(8);
  c.fillText('1 POINT PER DODGE  -  3 HITS AND YOU ARE OUT', 400, 388);
  c.fillText('HE GETS FASTER.  WATCH HIS WIND-UP.', 400, 406);
  if (Math.floor(anim * 2) % 2 === 0) {
    c.fillStyle = '#39ff14'; c.font = font(12);
    c.fillText(isTouch ? 'TAP TO START' : 'PRESS ENTER TO START', 400, 470);
  }
  c.fillStyle = '#777'; c.font = font(7);
  c.fillText('ARROWS OR A / S / D MOVE   P PAUSE   M MUTE   H HINTS', 400, 560);
}

function drawGameOver(c) {
  c.fillStyle = 'rgba(5,5,20,0.6)'; c.fillRect(0, 49, W, H - 49);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = font(36); c.fillStyle = '#7d1010'; c.fillText('YOU\'RE OUT!', 403, 163);
  c.fillStyle = '#ff4d4d'; c.fillText('YOU\'RE OUT!', 400, 160);
  c.font = font(14); c.fillStyle = '#fff';
  c.fillText('BALLS DODGED  ' + G.score, 400, 230);
  c.font = font(9); c.fillStyle = '#bbb';
  c.fillText('THROWN ' + G.throws + '   HITS ' + G.hitsTaken, 400, 260);
  if (G.newHigh && Math.floor(anim * 3) % 2 === 0) {
    c.font = font(16); c.fillStyle = '#f2b81c'; c.fillText('NEW HIGH SCORE!', 400, 310);
  }
  if (anim - G.overAt > 0.8 && Math.floor(anim * 2) % 2 === 0) {
    c.font = font(11); c.fillStyle = '#39ff14';
    c.fillText(isTouch ? 'TAP TO PLAY AGAIN' : 'PRESS ENTER TO PLAY AGAIN', 400, 470);
  }
}

/* ------------------------------------------------------------------ */
/*  Main draw                                                          */
/* ------------------------------------------------------------------ */
function draw(dt) {
  const c = ctx;
  c.setTransform(view.s * view.dpr, 0, 0, view.s * view.dpr, 0, 0);
  c.save();
  if (G.shake > 0) c.translate((Math.random() - 0.5) * 12 * G.shake / 0.3, (Math.random() - 0.5) * 8 * G.shake / 0.3);
  c.drawImage(bg, 0, 0, W, H);

  // opponent pose
  const o = { wind:0, follow:0, target:null, ion:null, lean:0, headDy:0, mood:G.mood, ballInHand:false, tossBall:false };
  if (G.windup) {
    o.wind = clamp((G.t - G.windup.start) / (G.windup.end - G.windup.start), 0, 1);
    o.target = G.windup.target; o.ion = G.windup.ion; o.ballInHand = true;
    o.lean = (o.target === 'left' ? -7 : o.target === 'right' ? 7 : 0) * o.wind;
    o.headDy = (o.target === 'high' ? -3 : 0) * o.wind;
  } else if (G.t - G.follow < 0.35 && G.mode !== 'title') {
    o.follow = (G.t - G.follow) / 0.35;
  }
  if (G.mode === 'title') o.tossBall = true;
  drawOpponent(c, o);

  // balls still coming at you
  const T = G.balls;
  for (const b of T) if (b.p < 1) {
    const p = ballPos(b); drawBall(c, p.x, p.y, p.r, p.a, b.ion);
    if (G.showHints && G.throws <= HINT_THROWS && b.p > 0.05) {
      const tg = TARGETS[b.target];
      keycap(c, tg.x + (b.target === 'left' ? -105 : b.target === 'right' ? 105 : 120), tg.y - 20, tg.key, tg.label);
    }
  }

  drawPlayer(c, dt);

  // balls that already reached you
  for (const b of T) if (b.p >= 1) { const p = ballPos(b); drawBall(c, p.x, p.y, p.r, p.a, b.ion); }

  drawPops(c);
  if (G.hitFlash > 0) { c.fillStyle = 'rgba(255,40,40,' + (G.hitFlash / 0.25) * 0.35 + ')'; c.fillRect(0, 0, W, H); }
  c.restore();

  drawHUD(c);
  if (G.mode === 'play' && G.throws === 0 && !G.windup) {
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = font(18);
    c.fillStyle = Math.floor(anim * 4) % 2 ? '#f2b81c' : '#fff'; c.fillText('GET READY!', 400, 90);
  }
  if (G.mode === 'title') drawTitle(c);
  if (G.mode === 'over')  drawGameOver(c);
  if (G.mode === 'pause') {
    c.fillStyle = 'rgba(5,5,20,0.6)'; c.fillRect(0, 49, W, H - 49);
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = font(26); c.fillStyle = '#fff';
    c.fillText('PAUSED', 400, 280);
    c.font = font(9); c.fillStyle = '#bbb'; c.fillText('PRESS P OR ENTER TO RESUME', 400, 320);
  }
  if (G.muted) { c.textAlign = 'left'; c.font = font(8); c.fillStyle = '#888'; c.fillText('MUTED', 18, 62); }
}

/* ------------------------------------------------------------------ */
/*  Loop                                                               */
/* ------------------------------------------------------------------ */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  anim += dt;
  if (G.mode === 'play') update(dt);
  else if (G.mode === 'over') coast(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ------------------------------------------------------------------ */
/*  Small public API for the quiz to hook into later                   */
/* ------------------------------------------------------------------ */
window.Dodgeball = {
  start: startGame,
  pause: () => { if (G.mode === 'play') G.mode = 'pause'; },
  resume: () => { if (G.mode === 'pause') G.mode = 'play'; },
  addLife: () => { if (G.mode === 'play' && G.lives < LIVES) { G.lives++; pop('+1 LIFE', 400, 300, '#39ff14'); } },
  getScore: () => G.score,
  getHighScore: () => G.high,
  state: G,
};

// When embedded in the quiz page, the parent can pause/resume via postMessage.
addEventListener('message', e => {
  const t = e.data && e.data.type;
  if (t === 'dodgeball:pause') window.Dodgeball.pause();
  else if (t === 'dodgeball:resume') window.Dodgeball.resume();
});
</script>
</body>
</html>
